<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Three-stage transfer learning and iterative refinement</title><desc id="desc">TAFT, DAFT, TSFT, deployment, GIS correction, and iterative sample refinement.</desc><style>.bg{fill:#fbfcfa}.stage{fill:#eef7f0;stroke:#2f6f5e;stroke-width:2}.data{fill:#eef3fb;stroke:#456a9f;stroke-width:2}.gis{fill:#fff4e9;stroke:#b46b2a;stroke-width:2}.txt{font:600 25px Arial,sans-serif;fill:#172126}.small{font:600 18px Arial,sans-serif;fill:#26363d}.tiny{font:500 14px Arial,sans-serif;fill:#5c6b73}.arrow{stroke:#172126;stroke-width:3;fill:none;marker-end:url(#m)}.loop{stroke:#9d3b3b;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#m2)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#172126"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9d3b3b"/></marker></defs><rect class="bg" width="1200" height="620" rx="18"/><text class="txt" x="48" y="58">TAFT-DAFT-TSFT transfer learning and deployment loop</text><rect class="data" x="52" y="135" width="185" height="95" rx="10"/><text class="small" x="84" y="174">Landslide</text><text class="small" x="98" y="198">prior data</text><rect class="stage" x="290" y="135" width="185" height="95" rx="10"/><text class="small" x="356" y="174">TAFT</text><text class="tiny" x="320" y="200">task-adaptive weights</text><rect class="data" x="528" y="135" width="185" height="95" rx="10"/><text class="small" x="566" y="174">Target</text><text class="small" x="566" y="198">imagery</text><rect class="stage" x="766" y="135" width="185" height="95" rx="10"/><text class="small" x="832" y="174">DAFT</text><text class="tiny" x="804" y="200">domain adaptation</text><rect class="data" x="52" y="340" width="185" height="95" rx="10"/><text class="small" x="80" y="379">Few-shot</text><text class="small" x="88" y="403">labels</text><rect class="stage" x="290" y="340" width="185" height="95" rx="10"/><text class="small" x="356" y="379">TSFT</text><text class="tiny" x="320" y="405">target calibration</text><rect class="stage" x="528" y="340" width="185" height="95" rx="10"/><text class="small" x="578" y="379">Inference</text><text class="tiny" x="558" y="405">probability + masks</text><rect class="gis" x="766" y="340" width="185" height="95" rx="10"/><text class="small" x="808" y="379">GIS review</text><text class="tiny" x="798" y="405">edit polygons</text><rect class="gis" x="1004" y="340" width="145" height="95" rx="10"/><text class="small" x="1038" y="379">Inventory</text><text class="tiny" x="1025" y="405">candidate map</text><path class="arrow" d="M237 182H290"/><path class="arrow" d="M475 182H528"/><path class="arrow" d="M713 182H766"/><path class="arrow" d="M858 230C850 276 790 323 713 360"/><path class="arrow" d="M237 388H290"/><path class="arrow" d="M475 388H528"/><path class="arrow" d="M713 388H766"/><path class="arrow" d="M951 388H1004"/><path class="loop" d="M858 435C780 535 360 540 145 435"/><text class="tiny" x="391" y="560">Corrected outputs can be registered as new TSFT samples for the next refinement round.</text></svg>
