<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">LSDFormer architecture schematic</title><desc id="desc">Redrawn schematic of the LSDFormer CNN-Transformer encoder-decoder architecture.</desc><style>.bg{fill:#f7faf8}.box{fill:#fff;stroke:#2f6f5e;stroke-width:2}.block{fill:#e6f1ee;stroke:#2f6f5e;stroke-width:2}.trans{fill:#eef3fb;stroke:#456a9f;stroke-width:2}.head{fill:#fff4e9;stroke:#b46b2a;stroke-width:2}.txt{font:600 24px Arial,sans-serif;fill:#172126}.small{font:500 17px Arial,sans-serif;fill:#34444b}.tiny{font:500 14px Arial,sans-serif;fill:#5c6b73}.arrow{stroke:#172126;stroke-width:3;fill:none;marker-end:url(#m)}.skip{stroke:#9d3b3b;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#m2)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#172126"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9d3b3b"/></marker></defs><rect class="bg" width="1200" height="740" rx="18"/><text class="txt" x="44" y="58">LSDFormer: compact CNN-Transformer hybrid network</text><text class="small" x="44" y="88">U-shaped encoder-decoder with Efficient-CT, Enhanced-CT, deep supervision, and transfer learning</text><rect class="box" x="44" y="130" width="145" height="82" rx="10"/><text class="small" x="77" y="166">Input</text><text class="tiny" x="75" y="190">256 x 256</text><rect class="block" x="230" y="126" width="145" height="90" rx="10"/><text class="small" x="254" y="160">Stem</text><text class="tiny" x="248" y="184">patch embed</text><rect class="trans" x="420" y="112" width="150" height="118" rx="10"/><text class="small" x="445" y="150">Stage 1</text><text class="tiny" x="444" y="176">Efficient-CT</text><text class="tiny" x="447" y="198">1/2 scale</text><rect class="trans" x="620" y="112" width="150" height="118" rx="10"/><text class="small" x="645" y="150">Stage 2</text><text class="tiny" x="644" y="176">Efficient-CT</text><text class="tiny" x="647" y="198">1/4 scale</text><rect class="trans" x="820" y="112" width="150" height="118" rx="10"/><text class="small" x="845" y="150">Stage 3</text><text class="tiny" x="844" y="176">Enhanced-CT</text><text class="tiny" x="847" y="198">1/8 scale</text><rect class="trans" x="1000" y="270" width="150" height="118" rx="10"/><text class="small" x="1025" y="308">Bottleneck</text><text class="tiny" x="1025" y="334">global context</text><text class="tiny" x="1044" y="356">1/32</text><rect class="block" x="820" y="500" width="150" height="105" rx="10"/><text class="small" x="842" y="538">Decoder 3</text><text class="tiny" x="836" y="564">upsample + fuse</text><rect class="block" x="620" y="500" width="150" height="105" rx="10"/><text class="small" x="642" y="538">Decoder 2</text><text class="tiny" x="636" y="564">upsample + fuse</text><rect class="block" x="420" y="500" width="150" height="105" rx="10"/><text class="small" x="442" y="538">Decoder 1</text><text class="tiny" x="436" y="564">upsample + fuse</text><rect class="head" x="230" y="492" width="145" height="120" rx="10"/><text class="small" x="252" y="532">Segmentation</text><text class="tiny" x="264" y="558">deep</text><text class="tiny" x="248" y="580">supervision</text><rect class="box" x="44" y="510" width="145" height="82" rx="10"/><text class="small" x="76" y="546">Mask</text><text class="tiny" x="77" y="570">landslide</text><path class="arrow" d="M189 171H230"/><path class="arrow" d="M375 171H420"/><path class="arrow" d="M570 171H620"/><path class="arrow" d="M770 171H820"/><path class="arrow" d="M970 190C1040 205 1075 226 1075 270"/><path class="arrow" d="M1075 388C1075 455 1018 552 970 552"/><path class="arrow" d="M820 552H770"/><path class="arrow" d="M620 552H570"/><path class="arrow" d="M420 552H375"/><path class="arrow" d="M230 552H189"/><path class="skip" d="M495 230V480"/><path class="skip" d="M695 230V480"/><path class="skip" d="M895 230V480"/><text class="tiny" x="500" y="358">skip connections</text><text class="tiny" x="44" y="690">Registered LSDetector implementation: 37.7M total params, 7.9M trainable params, 19.6G FLOPs.</text></svg>
