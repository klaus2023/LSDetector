<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">LSDSAM architecture schematic</title><desc id="desc">Redrawn schematic of the LSDSAM foundation-model landslide detection architecture.</desc><style>.bg{fill:#f8fafb}.box{fill:#fff;stroke:#197a83;stroke-width:2}.sam{fill:#eaf2ff;stroke:#456a9f;stroke-width:2}.task{fill:#eef7f0;stroke:#2f6f5e;stroke-width:2}.edge{fill:#fff3eb;stroke:#b46b2a;stroke-width:2}.head{fill:#fff;stroke:#9d3b3b;stroke-width:2}.txt{font:600 25px Arial,sans-serif;fill:#172126}.small{font:600 18px Arial,sans-serif;fill:#26363d}.tiny{font:500 14px Arial,sans-serif;fill:#5c6b73}.arrow{stroke:#172126;stroke-width:3;fill:none;marker-end:url(#m)}.dash{stroke:#2f6f5e;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#172126"/></marker></defs><rect class="bg" width="1200" height="700" rx="18"/><text class="txt" x="44" y="56">LSDSAM: SAM-derived landslide detector</text><text class="tiny" x="44" y="84">Visual foundation model + landslide-specific branches + PEFT + multilevel fusion</text><rect class="box" x="54" y="160" width="150" height="88" rx="10"/><text class="small" x="92" y="196">Image</text><text class="tiny" x="86" y="220">RGB bands</text><rect class="edge" x="54" y="330" width="150" height="96" rx="10"/><text class="small" x="82" y="368">Wavelet</text><text class="tiny" x="79" y="392">edge cues</text><rect class="sam" x="275" y="112" width="220" height="170" rx="12"/><text class="small" x="323" y="153">SAM image</text><text class="small" x="331" y="178">encoder</text><text class="tiny" x="302" y="210">ViT backbone with LoRA</text><text class="tiny" x="326" y="234">B / L / H scales</text><rect class="task" x="275" y="330" width="220" height="120" rx="12"/><text class="small" x="314" y="372">Task-specific</text><text class="small" x="344" y="397">branch</text><text class="tiny" x="318" y="424">landslide cues</text><rect class="task" x="550" y="330" width="190" height="120" rx="12"/><text class="small" x="596" y="372">CNN</text><text class="small" x="583" y="397">branch</text><text class="tiny" x="582" y="424">local details</text><rect class="sam" x="550" y="112" width="190" height="170" rx="12"/><text class="small" x="590" y="153">Multilevel</text><text class="small" x="592" y="178">features</text><text class="tiny" x="582" y="210">global + local</text><text class="tiny" x="596" y="234">representation</text><rect class="head" x="805" y="160" width="180" height="112" rx="12"/><text class="small" x="836" y="202">Cross-attn</text><text class="small" x="858" y="227">fusion</text><rect class="head" x="805" y="348" width="180" height="112" rx="12"/><text class="small" x="842" y="390">Multilevel</text><text class="small" x="815" y="415">segmentation head</text><rect class="box" x="1035" y="264" width="130" height="102" rx="10"/><text class="small" x="1063" y="304">Mask</text><text class="tiny" x="1058" y="330">landslide</text><path class="arrow" d="M204 204H275"/><path class="arrow" d="M204 378H275"/><path class="arrow" d="M495 198H550"/><path class="arrow" d="M495 390H550"/><path class="arrow" d="M740 198H805"/><path class="arrow" d="M895 272V348"/><path class="arrow" d="M985 404C1035 394 1065 374 1100 366"/><path class="arrow" d="M985 216C1035 226 1065 248 1100 264"/><path class="dash" d="M645 330V282"/><path class="dash" d="M385 330V282"/><text class="tiny" x="58" y="625">Registered LSDetector variants: LSDSAM-B 110.1M params, LSDSAM-L 339.5M params, LSDSAM-H 680.9M params.</text><text class="tiny" x="58" y="650">Fine-tuning uses LoRA-based parameter-efficient adaptation and the TAFT-DAFT-TSFT workflow.</text></svg>
