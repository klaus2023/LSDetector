<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">LSDetector software architecture</title><desc id="desc">Architecture of the LSDetector local workbench.</desc><style>.bg{fill:#f7faf8}.repo{fill:#fff;stroke:#2f6f5e;stroke-width:2}.stage{fill:#eef3fb;stroke:#456a9f;stroke-width:2}.out{fill:#fff4e9;stroke:#b46b2a;stroke-width:2}.txt{font:600 25px Arial,sans-serif;fill:#172126}.small{font:600 18px Arial,sans-serif;fill:#26363d}.tiny{font:500 14px Arial,sans-serif;fill:#5c6b73}.arrow{stroke:#172126;stroke-width:3;fill:none;marker-end:url(#m)}.dash{stroke:#5c6b73;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#172126"/></marker></defs><rect class="bg" width="1200" height="650" rx="18"/><text class="txt" x="48" y="56">LSDetector local workbench</text><text class="tiny" x="48" y="84">Model, weight, dataset, adaptation, deployment, evaluation, and GIS export in one registry-driven workflow</text><rect class="repo" x="58" y="135" width="190" height="95" rx="10"/><text class="small" x="85" y="174">Model Repository</text><text class="tiny" x="95" y="200">LSDFormer, LSDSAM</text><rect class="repo" x="58" y="277" width="190" height="95" rx="10"/><text class="small" x="85" y="316">Weight Repository</text><text class="tiny" x="86" y="342">TAFT, DAFT, TSFT</text><rect class="repo" x="58" y="419" width="190" height="95" rx="10"/><text class="small" x="82" y="458">Dataset Repository</text><text class="tiny" x="82" y="484">source, target, labels</text><rect class="stage" x="330" y="135" width="170" height="95" rx="10"/><text class="small" x="386" y="174">TAFT</text><text class="tiny" x="362" y="200">task adaptation</text><rect class="stage" x="550" y="135" width="170" height="95" rx="10"/><text class="small" x="606" y="174">DAFT</text><text class="tiny" x="590" y="200">domain alignment</text><rect class="stage" x="770" y="135" width="170" height="95" rx="10"/><text class="small" x="826" y="174">TSFT</text><text class="tiny" x="806" y="200">local calibration</text><rect class="stage" x="330" y="330" width="185" height="105" rx="10"/><text class="small" x="377" y="370">Prepare</text><text class="tiny" x="357" y="397">tiles + RGB bands</text><rect class="stage" x="565" y="330" width="185" height="105" rx="10"/><text class="small" x="610" y="370">Inference</text><text class="tiny" x="602" y="397">patch prediction</text><rect class="stage" x="800" y="330" width="185" height="105" rx="10"/><text class="small" x="846" y="370">Mosaic</text><text class="tiny" x="835" y="397">probability + mask</text><rect class="out" x="1025" y="330" width="135" height="105" rx="10"/><text class="small" x="1052" y="370">Vector</text><text class="tiny" x="1044" y="397">GPKG/SHP/JSON</text><rect class="out" x="800" y="500" width="185" height="82" rx="10"/><text class="small" x="845" y="534">Evaluation</text><text class="tiny" x="830" y="560">requires ground truth</text><path class="arrow" d="M248 182H330"/><path class="arrow" d="M248 324C284 295 310 250 330 208"/><path class="arrow" d="M248 467C305 450 315 405 330 382"/><path class="arrow" d="M500 182H550"/><path class="arrow" d="M720 182H770"/><path class="dash" d="M855 230V330"/><path class="arrow" d="M515 382H565"/><path class="arrow" d="M750 382H800"/><path class="arrow" d="M985 382H1025"/><path class="dash" d="M892 435V500"/><text class="tiny" x="48" y="600">Deployment exports reviewable candidate landslide polygons. Evaluation is independent and requires labeled datasets.</text></svg>
